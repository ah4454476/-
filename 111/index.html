<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">My Blog</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active fw-bold" href="index.html">Home</a></li>
                </ul>
                <form class="d-flex" onsubmit="event.preventDefault();">
                    <input id="search-input" class="form-control form-control-sm me-2" type="search" placeholder="Search recipes..." onkeyup="searchPosts()">
                </form>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        <div class="row">
            <div class="col-lg-8 col-md-7 col-12">
                <h3 class="mb-3 theme-heading">Latest Recipes</h3>
                <div id="posts-container">
                    <div class="spinner-border text-danger" role="status"><span class="visually-hidden">Loading...</span></div>
                </div>
            </div>
            <div class="col-lg-4 col-md-5 col-12">
                <div class="sidebar-box">
                    <h5 class="theme-heading border-bottom pb-2">Categories</h5>
                    <div id="categories-list"></div>
                </div>
                <div class="sidebar-box">
                    <h5 class="theme-heading border-bottom pb-2">About Blog</h5>
                    <p class="small mb-0">Welcome to our food & recipes blog.</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p class="mb-1">&copy; <span id="current-year"></span> My Blog. All rights reserved.</p>
            <div><a href="#">Privacy Policy</a> | <a href="#">Terms of Use</a> | <a href="#">Disclaimer</a></div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="posts-list.js"></script>
    <script src="script.js"></script>
    <script>
        loadLocalPosts();
    </script>
</body>
</html>
