<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog - Recipe View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.png">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">My Blog</a>
            <ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li></ul>
        </div>
    </nav>

    <div class="container main-content">
        <div class="row">
            <div class="col-lg-8 col-md-7 col-12">
                <a href="index.html" class="btn btn-sm text-white mb-3" style="background-color: #500000;">← Back to All Recipes</a>
                <div id="content" class="post-card post-body">
                    <div class="spinner-border text-danger" role="status"><span class="visually-hidden">Loading...</span></div>
                </div>
            </div>
            <div class="col-lg-4 col-md-5 col-12">
                <div class="sidebar-box">
                    <h5 class="theme-heading border-bottom pb-2">Categories</h5>
                    <div id="categories-list"></div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p class="mb-1">&copy; <span id="current-year"></span> My Blog. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="posts-list.js"></script>
    <script src="script.js"></script>
    <script>
        loadSinglePost();
    </script>
</body>
</html>
