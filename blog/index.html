<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Blog - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="edit.js" defer></script>
    <link rel="icon" type="image/svg+xml" href="favicon.png">
</head>
<body>

    <!-- Main Wrapper for Sticky Footer -->
    <div class="main-wrapper">
        <!-- Header / Navigation Bar -->
        <nav class="navbar navbar-expand-lg sticky-top">
            <div class="container">
                <a class="navbar-brand" href="index.html">Recipe Blog</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
                    <ul class="navbar-nav mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="category.html">Categories</a></li>
                    </ul>
                    <form class="d-flex search-form" role="search" onsubmit="event.preventDefault();">
                        <input class="form-control me-2" type="search" placeholder="Search blog..." style="width: 220px;">
                        <button class="btn btn-outline-dark" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>

        <!-- Hero Section -->
        <header class="bg-light py-5 border-bottom mb-4">
            <div class="container text-center">
                <h1 class="fw-bold">Delicious & Easy Recipes</h1>
                <p class="text-muted lead">The best collection of food and cooking tips</p>
            </div>
        </header>

        <!-- Main Content -->
        <div class="container">
            <div class="row">
                <div class="col-lg-8">
                    <h2 class="mb-4 pb-2 border-bottom">Recent Posts</h2>
                    <div id="recent-posts-container"></div>
                </div>

                <div class="col-lg-4">
                    <div class="sidebar-widget">
                        <h4>Popular Posts</h4>
                        <ul class="list-unstyled mb-0" id="popular-posts-container"></ul>
                    </div>

                    <div class="sidebar-widget">
                        <h4>Categories</h4>
                        <div class="d-grid gap-2 category-list dynamic-categories"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

  <!-- Footer -->
    <footer>
        <div class="container">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-center">
                <p class="mb-0 text-white small">&copy; <span id="current-year"></span> Recipe Blog. All rights reserved.</p>
                <div class="footer-links">
                    <a href="#">Privacy Policy</a> | 
                    <a href="#">Terms & Conditions</a> | 
                    <a href="#">Contact Us</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="posts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
